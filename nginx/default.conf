server {
  listen 4000;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 256;

  # Q5.11 / M-13 / M-14: security headers + CSP live in snippet files so every
  # location that sets its own add_header (which cancels ALL inherited
  # add_header directives — nginx rule) can re-include them without drift.
  include /etc/nginx/snippets/security-headers.conf;
  include /etc/nginx/snippets/csp.conf;

  # SPA fallback. Extension-less routes land here and are rewritten to
  # /index.html; the internal redirect re-runs location matching, so the
  # "location = /index.html" block below stamps the final headers. Matches
  # ngsw navigationUrls ("/**" minus "!/**/*.*"): the SW only treats
  # extension-less URLs as navigations, exactly the set that falls through
  # to this fallback. No add_header here, so server-level headers apply to
  # anything served directly (e.g. /manifest.webmanifest).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # M-13/A14: index.html must revalidate on every load. A cached index.html
  # pins old bundle URLs and stalls the ngsw update flow (the SW fetches
  # index.html to detect new versions).
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp.conf;
  }

  # Stock mime.types lacks .webmanifest (was served as application/octet-stream).
  # No add_header here, so server-level security headers still apply.
  location = /manifest.webmanifest {
    types {}
    default_type application/manifest+json;
  }

  # M-13/A14: service-worker control files must never be cached by proxies or
  # browsers — ngsw.json is the update manifest and ngsw-worker.js is the SW
  # script (safety-worker/worker-basic are @angular/service-worker's kill
  # switch and must stay fetchable fresh). No CSP here on purpose: a CSP on
  # the worker script would govern the worker context (see csp.conf).
  location ~ ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Q5.12 / M-13: long immutable cache ONLY for content-hashed build output.
  # The Angular/esbuild builder emits an 8-char uppercase-alphanumeric hash
  # suffix (main-MEYO3DB2.js, chunk-26FBJO4V.js, styles-6YXULQHQ.css) —
  # verified against dist/frontend/browser. Case-sensitive match so unhashed
  # lowercase names never qualify.
  location ~ "-[A-Z0-9]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # M-13: monaco-editor is copied UNHASHED into /assets/monaco-editor
  # (angular.json assets glob) — it must never be immutable. Moderate cache;
  # a new monaco version after an upgrade must be picked up within a day.
  # ^~ so the media-extension regex below cannot capture monaco's ttf/svg/css.
  location ^~ /assets/monaco-editor/ {
    add_header Cache-Control "public, max-age=86400";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # The entry points monaco loads first are unhashed, while everything they pull
  # in IS content-hashed (css-CaeNmE3S.js and friends). Cached for a day, an old
  # entry point would keep asking for hashed chunks that a new monaco release no
  # longer ships, and the editor would 404 its way through the whole cache
  # window. Revalidating just these keeps the rest cacheable.
  # Exact (=) matches, because the ^~ prefix above suppresses regex locations.
  location = /assets/monaco-editor/min/vs/loader.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
  location = /assets/monaco-editor/min/vs/editor/editor.main.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
  location = /assets/monaco-editor/min/vs/editor/editor.main.css {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # M-13: unhashed static media from public/ (icons/, images/, favicons,
  # manifest icons, fonts). Moderate cache, revalidate after 7 days — these
  # filenames do not change when their content changes.
  location ~* \.(ico|png|jpe?g|gif|svg|webp|avif|apng|cur|otf|ttf|eot|woff2?)$ {
    add_header Cache-Control "public, max-age=604800, must-revalidate";
    include /etc/nginx/snippets/security-headers.conf;
  }
}
