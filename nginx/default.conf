server {
  listen 4000;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 256;

  # Q5.11: Security headers applied to all responses.
  #
  # HSTS is intentionally NOT set here. The outer prod nginx is the TLS
  # terminator and owns HSTS (max-age 2y + preload). Setting a shorter
  # value here would conflict if the inner response ever leaked through.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com https://*.sentry.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.sentry.io https://*.google.com; frame-src https://www.google.com; object-src 'none'; base-uri 'self'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* /favicon\.(ico|svg)$ {
    expires 7d;
    add_header Cache-Control "public, must-revalidate";
  }

  # Q5.12: Immutable cache for content-hashed assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
