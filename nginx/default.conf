server {
  listen 4000;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 256;

  # Q5.11: Security headers applied to all responses.
  #
  # HSTS is intentionally NOT set here. The outer prod nginx is the TLS
  # terminator and owns HSTS (max-age 2y + preload). Setting a shorter
  # value here would conflict if the inner response ever leaked through.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  # CSP must match what the app actually loads (kept in sync with the <meta> in
  # index.html). The previous policy was stale: it allowed *.sentry.io (Sentry is
  # disabled — empty DSN) but blocked the things the app DOES use, so the browser
  # (which enforces header AND meta as an intersection) blocked the anti-FOUC
  # theme script + onload handlers (no 'unsafe-inline'), FontAwesome (cdnjs),
  # Google Fonts swap, and the GitHub repos widget (api.github.com).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: https://cdn.catananti.dev https://avatars.githubusercontent.com https://lh3.googleusercontent.com https://media.licdn.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://www.google.com https://cdn.catananti.dev https://cloudflareinsights.com; frame-src https://www.google.com blob: data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* /favicon\.(ico|svg)$ {
    expires 7d;
    add_header Cache-Control "public, must-revalidate";
  }

  # Q5.12: Immutable cache for content-hashed assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
