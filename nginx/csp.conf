# Content-Security-Policy — single source of truth on the nginx side.
# MUST be kept in sync with the <meta http-equiv> CSP in src/index.html
# (browsers enforce the INTERSECTION of header and meta policies).
#
# The policy value is deliberately unchanged from the audited Q5.11 version:
# it allows the anti-FOUC inline theme script ('unsafe-inline'), FontAwesome
# (cdnjs), Google Fonts, the GitHub repos widget (api.github.com via img-src
# avatars + connect-src) and Cloudflare Insights, and blocks framing
# (frame-ancestors 'none').
#
# Included at the server level and in the location = /index.html block (which
# would otherwise lose it to nginx's add_header inheritance rule). Static
# asset locations intentionally do NOT include this file: a CSP delivered
# with ngsw-worker.js would govern the worker context and its connect-src
# would break the service worker's Google Fonts caching group.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data: https://cdn.catananti.dev https://avatars.githubusercontent.com https://lh3.googleusercontent.com https://media.licdn.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://www.google.com https://cdn.catananti.dev https://cloudflareinsights.com; frame-src https://www.google.com blob: data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
