# Baseline security headers (Q5.11, M-13/M41).
#
# nginx inheritance rule: a location block with ANY add_header of its own
# cancels ALL add_header directives inherited from the server level. This file
# is therefore included at the server level AND re-included in every location
# that sets its own headers (e.g. Cache-Control), so no response ever loses
# these headers. Deployed to /etc/nginx/snippets/ by the Dockerfile (NOT
# conf.d/, which nginx auto-includes at http level).
#
# HSTS is intentionally NOT set here. The outer prod nginx is the TLS
# terminator and owns HSTS (max-age 2y + preload). Setting a shorter
# value here would conflict if the inner response ever leaked through.
#
# X-Frame-Options is DENY (M-14): the edge nginx sends DENY and the CSP sends
# frame-ancestors 'none'; this layer must agree, not weaken to SAMEORIGIN.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
