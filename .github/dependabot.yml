version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(ci)"
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@ngtools/*"
      eslint:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright"
      types:
        patterns:
          - "@types/*"
    commit-message:
      prefix: "chore(deps)"
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # zone.js 0.16 is outside Angular 20's peer range (@angular/core 20.3.x
      # declares ~0.15.0; the range only widens in @angular/core 21.1). A bump
      # here resolves only with --force and was reverted once already. Drop this
      # entry when the app moves to Angular 21.1+.
      - dependency-name: "zone.js"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
