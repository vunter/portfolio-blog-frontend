name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # Supply-chain guardrail (parity with backend ci.yml): every third-party action
  # must reference an immutable commit SHA, not a force-pushable tag. actions/* and
  # github/* are GitHub-maintained and allowed by tag; everything else needs @<sha>.
  pin-check:
    name: Action Pin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify third-party actions are pinned by SHA
        run: |
          set -euo pipefail
          mapfile -t bad < <(grep -RhnE '^[[:space:]]*-?[[:space:]]*uses: ' .github/workflows \
            | grep -vE 'uses: actions/' \
            | grep -vE 'uses: github/' \
            | grep -vE 'uses: \./' \
            | grep -vE 'uses: [^@]+@[a-f0-9]{40}( |$)') || true
          if [ ${#bad[@]} -gt 0 ]; then
            echo "::error::The following 'uses:' references are not SHA-pinned:"
            printf '  %s\n' "${bad[@]}"
            exit 1
          fi
          echo "All third-party actions are SHA-pinned"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --verbose --no-banner --exit-code 1

  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Dependency vulnerability gate — parity with the backend's OWASP
      # Dependency-Check. Fails the build on HIGH/CRITICAL advisories in
      # production dependencies (dev-only advisories are reported, not gating).
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Lint (Q12.5)
        run: npx ng lint

      - name: Unit tests with coverage (Q12.2)
        run: npx ng test --no-watch --browsers=ChromeHeadless --code-coverage

      - name: Build (production)
        run: npx ng build --configuration=production

      - name: Generate SBOM (Q14.5)
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json --output-format JSON

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  a11y:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npx ng build --configuration=production

      - name: Serve and audit with Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --config=lighthouserc.json

  e2e:
    name: E2E Tests (Q12.6)
    runs-on: ubuntu-latest
    needs: [build]
    # The E2E specs authenticate against /api/v1/* but CI only starts `ng serve`
    # (no backend API/Postgres/Redis), so on a normal PR every auth-gated test
    # waits out its timeout and the job would hang for hours and leave the pipeline
    # red. Until the full stack is provisioned in CI, run E2E on demand only
    # (workflow_dispatch) and hard-cap the job so it can never hang the 6h default.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --reporter=list
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: portfolio-blog-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Image vulnerability scan — parity with the backend pipeline. Fails on
      # fixable CRITICAL/HIGH findings and uploads results to GitHub Security.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: portfolio-blog-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
