title = "gitleaks config"

# Extends the bundled default ruleset. The CI "Secret Scan" job scans the full
# git history (fetch-depth: 0), so historical commits are scanned too. The
# allowlist below covers paths that only ever hold non-secret values:
#   - i18n catalogs: the `linkedin-client-id` rule false-matches the word
#     "LinkedIn" next to a 14-char translated word.
#   - Angular environment files: client-side config compiled into the browser
#     bundle (public by definition) — holds the public reCAPTCHA v3 site key.
# Real secrets (tokens, DSNs) are injected at build time and never committed.

[extend]
useDefault = true

[allowlist]
description = "i18n catalogs and Angular client-side env config (no real secrets)"
paths = [
  '''src/app/core/services/i18n/''',
  '''src/environments/''',
]
